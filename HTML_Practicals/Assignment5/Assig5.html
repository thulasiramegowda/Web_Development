
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>HTML Tags Demonstration</title>
</head>
<body>

    <header>
        <h1>HTML Semantic Tags</h1>
    </header>

    <main>
        <section>
            <h2>Using Figure and Figcaption Tags</h2>

            <figure>
                <img src="laptop.jpg"
                     alt="Three variants of laptops"
                     width="600">

                <figcaption>
                    Figure 1.1: Three Variants of Laptops
                </figcaption>
            </figure>
        </section>

        <section>
            <h2>Core Components of a Hero Section</h2>
            <p>
                A hero section introduces the main
                content of a webpage.
            </p>
        </section>
    </main>

</body>
</html>
